[workspace]
resolver = "2"
members = ["crates/kovanica-dag", "crates/kovanica-state", "crates/kovanica-node", "crates/kovanica-cli", "crates/kovanica-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KovanicaDAG/kovanica-node"
rust-version = "1.75"

[workspace.dependencies]
blake3 = { version = "1", features = ["pure"] }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }
curve25519-dalek = "4"
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
thiserror = "2"
