[workspace]
resolver = "2"
members = ["crates/kovanica-dag", "crates/kovanica-state", "crates/kovanica-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KovanicaDAG/kovanica-node"
rust-version = "1.75"

[workspace.dependencies]
blake3 = "1"
hex = "0.4"
ed25519-dalek = "2"
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "macros"] }
tokio = { version = "1.30", features = ["full"] }
futures = "0.3"
